baseURL = 'https://krystofklen.com/'
locale = 'en-us'
title = 'Kryštof Klen - Blog'
theme = "nojs"

[taxonomies]
  tag = "tags"
  category = "categories"

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 1

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 2

  [[menus.main]]
    name = 'Categories'
    pageRef = '/categories'
    weight = 3

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 4

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  
[caches]
  [caches.images]
    dir = ':cacheDir/images'
